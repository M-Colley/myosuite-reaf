[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "myosuite-reaf"
version = "0.1.0"
description = "Musculoskeletal MyoSuite environments authored on Google DeepMind's reaf-sim and mujoco_playground (PyTorch + MuJoCo 4 + MuJoCo Warp)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
authors = [
    { name = "Mark Colley", email = "39366189+M-Colley@users.noreply.github.com" },
]
keywords = [
    "mujoco",
    "mujoco-warp",
    "reaf-sim",
    "mujoco-playground",
    "myosuite",
    "biomechanics",
    "musculoskeletal",
    "reinforcement-learning",
    "pytorch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "reaf-sim>=1.0.1",
    "playground[rl]>=1.0.1",
    "myo-sim>=0.2.5",
    "gymnasium>=1.0,<1.3",
    "numpy>=2.1",
    "torch>=2.7.0,<2.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "ruff>=0.9",
]

[project.urls]
Homepage = "https://github.com/M-Colley/myosuite-reaf"
Repository = "https://github.com/M-Colley/myosuite-reaf"
Issues = "https://github.com/M-Colley/myosuite-reaf/issues"

[tool.setuptools.packages.find]
where = ["src"]

# myo-sim==0.2.5 pins mujoco>=3.4,<4 in package metadata even though its MJCF
# assets, 3CC-r fatigue (TorchFatigueState), and JointCouplings work cleanly
# on MuJoCo 4.x. Override until myo-sim widens its upper bound.
[tool.uv]
override-dependencies = ["mujoco[sysid]>=4.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "cuda: requires an NVIDIA CUDA GPU for mujoco-warp execution",
    "slow: end-to-end RL training or large-batch benchmark tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
